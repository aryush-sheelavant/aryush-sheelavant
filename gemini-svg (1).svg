<svg width="518" height="128" viewBox="0 0 518 128" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#0d1117"/>
  
  <style>
    .colored-blocks use {
      animation: drop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      transform: translateY(-150px);
      opacity: 0;
    }
    
    @keyframes drop {
      0% { transform: translateY(-150px); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: translateY(0); opacity: 1; }
    }

    /* Stagger delays by X coordinate (column) for a left-to-right cascade */
    /* Letter A */
    .colored-blocks use[x="13"] { animation-delay: 0.1s; }
    .colored-blocks use[x="26"] { animation-delay: 0.2s; }
    .colored-blocks use[x="39"] { animation-delay: 0.3s; }
    .colored-blocks use[x="52"] { animation-delay: 0.4s; }
    .colored-blocks use[x="65"] { animation-delay: 0.5s; }
    /* Letter R */
    .colored-blocks use[x="91"] { animation-delay: 0.8s; }
    .colored-blocks use[x="104"] { animation-delay: 0.9s; }
    .colored-blocks use[x="117"] { animation-delay: 1.0s; }
    .colored-blocks use[x="130"] { animation-delay: 1.1s; }
    .colored-blocks use[x="143"] { animation-delay: 1.2s; }
    /* Letter Y */
    .colored-blocks use[x="169"] { animation-delay: 1.5s; }
    .colored-blocks use[x="182"] { animation-delay: 1.6s; }
    .colored-blocks use[x="195"] { animation-delay: 1.7s; }
    .colored-blocks use[x="208"] { animation-delay: 1.8s; }
    .colored-blocks use[x="221"] { animation-delay: 1.9s; }
    /* Letter U */
    .colored-blocks use[x="247"] { animation-delay: 2.2s; }
    .colored-blocks use[x="260"] { animation-delay: 2.3s; }
    .colored-blocks use[x="273"] { animation-delay: 2.4s; }
    .colored-blocks use[x="286"] { animation-delay: 2.5s; }
    .colored-blocks use[x="299"] { animation-delay: 2.6s; }
    /* Letter S */
    .colored-blocks use[x="325"] { animation-delay: 2.9s; }
    .colored-blocks use[x="338"] { animation-delay: 3.0s; }
    .colored-blocks use[x="351"] { animation-delay: 3.1s; }
    .colored-blocks use[x="364"] { animation-delay: 3.2s; }
    .colored-blocks use[x="377"] { animation-delay: 3.3s; }
    /* Letter H */
    .colored-blocks use[x="403"] { animation-delay: 3.6s; }
    .colored-blocks use[x="416"] { animation-delay: 3.7s; }
    .colored-blocks use[x="429"] { animation-delay: 3.8s; }
    .colored-blocks use[x="442"] { animation-delay: 3.9s; }
    .colored-blocks use[x="455"] { animation-delay: 4.0s; }
  </style>

  <defs>
    <rect id="sq" width="10" height="10" rx="2"/>
    <g id="bg-col">
      <use href="#sq" y="0"/>
      <use href="#sq" y="13"/>
      <use href="#sq" y="26"/>
      <use href="#sq" y="39"/>
      <use href="#sq" y="52"/>
      <use href="#sq" y="65"/>
      <use href="#sq" y="78"/>
    </g>
  </defs>

